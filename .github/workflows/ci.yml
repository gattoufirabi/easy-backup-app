name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Check Go formatting
        shell: bash
        working-directory: engine
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet and build the engine
        shell: cmd
        run: |
          cd engine && go vet ./... && cd ..
          call build_engine.bat

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v

  # Construit un installeur de test à chaque push sur main (artefact téléchargeable 14 jours).
  installer:
    needs: test
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Select-String -Path easybackup\__init__.py -Pattern '^__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          .\tools\ci_build.ps1 -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: EasyBackup-Setup-${{ github.sha }}
          path: dist/EasyBackup-Setup-*.exe
          retention-days: 14
